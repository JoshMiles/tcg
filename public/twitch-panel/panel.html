<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Collection</title>
  <link rel="stylesheet" href="panel.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <!-- Loading -->
  <div id="state-loading" class="state">
    <div class="spinner"></div>
    <p class="muted">Loading...</p>
  </div>

  <!-- No active season -->
  <div id="state-no-season" class="state hidden">
    <div class="empty-icon">🃏</div>
    <p class="empty-title">No active season</p>
    <p class="muted">Check back when the stream is live!</p>
  </div>

  <!-- Enter username -->
  <div id="state-enter-username" class="state hidden">
    <div class="season-header" id="login-season-header"></div>
    <div class="login-body">
      <p class="login-prompt">Enter your Twitch chat username to see your collection:</p>
      <form id="username-form">
        <input
          id="username-input"
          type="text"
          placeholder="your_username"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="40"
        >
        <button type="submit">View My Collection →</button>
      </form>
    </div>
  </div>

  <!-- Collection view -->
  <div id="state-collection" class="state hidden">
    <!-- Season header -->
    <div class="season-header" id="collection-season-header"></div>

    <!-- Pack tabs -->
    <div class="pack-tabs" id="pack-tabs"></div>

    <!-- Card grid -->
    <div class="grid-area">
      <div class="card-grid" id="card-grid"></div>
    </div>

    <!-- Footer -->
    <div class="panel-footer">
      <span class="footer-username" id="footer-username"></span>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="change-btn" id="refresh-btn" title="Refresh collection">↻</button>
        <button class="change-btn" id="change-user-btn">change</button>
      </div>
    </div>
  </div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="panel.js"></script>
</body>
</html>
