<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>The Cheesy TCG</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="views.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="view-mobile">

  <!-- Twitch Extension "Mobile" view. Same markup and panel.js as panel.html; layout comes from views.css (.view-mobile). -->

  <!-- Build version (filled from /api/version by panel.js) -->
  <span id="panel-version" class="panel-version"></span>

  <!-- Loading -->
  <div id="state-loading" class="state">
    <div class="spinner"></div>
    <p class="muted">Loading...</p>
  </div>

  <!-- No active season -->
  <div id="state-no-season" class="state hidden">
    <div class="empty-icon"><svg class="empty-svg" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></div>
    <p class="empty-title">No active season</p>
    <p class="muted">Check back when the stream is live!</p>
  </div>

  <!-- Login screen -->
  <div id="state-login" class="hidden">
    <div class="login-teaser" id="login-teaser"></div>
    <div class="login-content">
      <p class="login-eyebrow">Active Season</p>
      <p class="login-title" id="login-season-name">Card Collection</p>
      <p class="login-sub" id="login-card-count"></p>
      <p class="login-pitch">See your cards, upgrade duplicates and climb the leaderboard. Only your Twitch name is used.</p>
      <button id="login-btn" class="login-btn">Login with Twitch</button>
      <p class="login-status hidden" id="login-status"></p>
      <p class="login-legal">By logging in you agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms</a> and <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</p>
    </div>
  </div>

  <!-- Collection view -->
  <div id="state-collection" class="state hidden">
    <!-- Season header -->
    <div class="season-header" id="collection-season-header"></div>

    <!-- View tabs: collection / stats / leaderboard -->
    <div class="view-tabs" id="view-tabs" role="tablist" aria-label="Panel sections">
      <button class="view-tab active" data-view="collection" role="tab" aria-selected="true">Collection</button>
      <button class="view-tab" data-view="stats" role="tab" aria-selected="false">Stats<span class="tab-dot hidden" id="stats-dot" title="Trade offers are waiting"></span></button>
      <button class="view-tab" data-view="leaderboard" role="tab" aria-selected="false">Board</button>
    </div>

    <!-- Problem banner (couldn't load your cards, etc.) -->
    <div class="panel-banner hidden" id="panel-banner" role="alert"></div>

    <!-- Pack tabs + Have / Missing filter -->
    <div class="pack-tabs" id="pack-tabs"></div>
    <div class="grid-tools" id="grid-tools"></div>

    <!-- Card grid -->
    <div class="grid-area" id="collection-area">
      <div class="card-grid" id="card-grid"></div>
    </div>

    <!-- Stats (built in panel.js) -->
    <div class="grid-area hidden" id="stats-area"></div>

    <!-- Leaderboard (built in panel.js) -->
    <div class="grid-area hidden" id="leaderboard-area"></div>

    <!-- Footer -->
    <div class="panel-footer">
      <a class="footer-username" id="footer-username" target="_blank" rel="noopener noreferrer" title="Open your collection page"></a>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="change-btn" id="refresh-btn" title="Refresh collection">↻</button>
        <button class="change-btn" id="logout-btn">logout</button>
      </div>
    </div>
  </div>

  <!-- Card detail overlay (opened by clicking a card; built in panel.js) -->
  <div id="card-detail" class="card-detail hidden" role="dialog" aria-modal="true" aria-label="Card details">
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <div class="detail-body">
      <button class="detail-close" id="detail-close" aria-label="Close card details">×</button>
      <div class="detail-stage">
        <button class="detail-nav" id="detail-prev" aria-label="Previous card">‹</button>
        <div class="detail-art" id="detail-art"></div>
        <button class="detail-nav" id="detail-next" aria-label="Next card">›</button>
      </div>
      <div class="detail-info" id="detail-info"></div>
    </div>
  </div>

  <!-- "New card" toast (built in panel.js) -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="mock-twitch-ext.js"></script>
  <script src="panel.js"></script>
</body>
</html>
