name: TCG Bridge

# Pull requests that touch the desktop app typecheck it and run its checks. A pushed tag `bridge-v<version>` (the version in
# bridge/package.json) builds the Windows installer and attaches it to a GitHub Release, which the app updates itself from.
on:
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  push:
    tags: ['bridge-v*']

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the checks and the typecheck need no Electron binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # attaches the installer to the release
    defaults:
      run:
        working-directory: bridge
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - name: The tag must match the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "bridge-v$version" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
      - run: npm run typecheck
      - run: npm run check
      - run: npm run dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.exe.blockmap release/latest.yml \
            --title "TCG Bridge ${GITHUB_REF_NAME#bridge-v}" \
            --notes "Windows installer for TCG Bridge. This build is not code-signed: Windows SmartScreen shows \"More info\", then \"Run anyway\"."
