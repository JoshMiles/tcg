name: OBS plugin

# Builds obs-plugin/ (the TCG dock for OBS, ROADMAP Track 62) against OBS 31.1.1 with the prebuilt obs-deps and Qt6 that obs-plugin/buildspec.json pins,
# runs its tests and keeps the built plugin as an artifact. bridge.yml calls it (workflow_call) for a TCG Bridge release, which ships that artifact inside the installer (62.5).
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'obs-plugin/**'
      - '.github/workflows/obs-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'obs-plugin/**'
      - '.github/workflows/obs-plugin.yml'

permissions:
  contents: read

concurrency:
  group: obs-plugin-${{ github.event_name == 'pull_request' && github.ref || github.run_id }} # a push or a call from bridge.yml is its own group: it must never cancel a release build
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022 # windows-latest now has Visual Studio 2026 only; the preset (the template's) uses Visual Studio 17 2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Cache OBS sources and dependencies
        uses: actions/cache@v4
        with:
          path: obs-plugin/.deps
          key: obs-deps-${{ hashFiles('obs-plugin/buildspec.json') }}

      - name: Configure (downloads OBS 31.1.1, obs-deps and Qt6 on a cold cache)
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-x64 --parallel

      - name: Test
        run: ctest --preset windows-x64

      - name: Install
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "${{ github.workspace }}/obs-plugin/release"

      - name: Check the install layout (TCG Bridge copies this folder into OBS's plugin folder)
        run: |
          foreach ($f in 'bin/64bit/tcg-obs.dll', 'data/locale/en-US.ini') {
            if (-not (Test-Path "release/tcg-obs/$f")) { throw "release/tcg-obs/$f is missing" }
          }

      - name: Keep the plugin
        uses: actions/upload-artifact@v4
        with:
          name: tcg-obs-windows-x64
          path: obs-plugin/release/tcg-obs
          if-no-files-found: error
