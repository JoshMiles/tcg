name: PR description

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-docs diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pr-body.mjs
      # Code changed without its docs (docs/doc-map.json, wiki "covers:" lines) fails unless the body's "## Docs" section opts out.
      - run: node scripts/check-docs.mjs
